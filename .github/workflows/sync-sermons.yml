name: Sync finalized sermons

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sermon-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SERMON_ARCHIVE_API_URL: https://sermons.mesropash.com/api/v1/sermons
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run sync:sermons

      - name: Restore Clef decision cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/clef-responses.json
            .cache/navigator-responses.json
            .cache/navigator-progress.json
          key: sermon-discovery-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sermon-discovery-v2-${{ runner.os }}-
            sermon-clef-v1-${{ runner.os }}-

      - name: Refresh sermon topics and similar sermons
        continue-on-error: true
        env:
          CLOUDFLARE_WORKERSAI_API_KEY: ${{ secrets.CLOUDFLARE_WORKERSAI_API_KEY }}
          CLOUDFLARE_WORKERSAI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_WORKERSAI_ACCOUNT_ID }}
        run: npm run discovery:refresh -- --if-credentials

      - name: Refresh sermon key-point navigators
        continue-on-error: true
        env:
          CLOUDFLARE_WORKERSAI_API_KEY: ${{ secrets.CLOUDFLARE_WORKERSAI_API_KEY }}
          CLOUDFLARE_WORKERSAI_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_WORKERSAI_ACCOUNT_ID }}
        run: npm run navigators:refresh -- --if-credentials

      - run: npm test
      - run: npm run check
      - run: npm run build

      - name: Commit published sermons and discovery data
        run: |
          git add src/content/sermons src/data/discovery.json src/data/navigators.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "sermon archive sync"
          git config user.email "sermon-archive-sync@users.noreply.github.com"
          git commit -m "chore: sync finalized sermons"
          git push

