name: Sync finalized sermons

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SERMON_ARCHIVE_API_URL: https://sermon-archive.mesropash.com/api/v1/sermons
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run sync:sermons

      - name: Commit changed Markdown
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "sermon archive sync"
          git config user.email "sermon-archive-sync@users.noreply.github.com"
          git add src/content/sermons
          git commit -m "chore: sync finalized sermons"
          git push

